name: Windows PS3 Lab parity and prerelease

on:
  push:
    branches: [ feature/ps3-parity-diagnostics-20261124, feature/windows-jellyfin-theater-20261124 ]
    paths:
      - 'tools/ps3-lab-windows/**'
      - '.github/workflows/windows-ps3-lab.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'tools/ps3-lab-windows/**'
      - '.github/workflows/windows-ps3-lab.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ps3-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-parity:
    name: Linux deterministic PS3 protocol and timing tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Syntax compile
        run: python -m compileall -q tools/ps3-lab-windows
      - name: Reference protocol and timing tests
        run: python -m unittest discover -s tests -v
        working-directory: tools/ps3-lab-windows
      - name: Install FFmpeg on the hosted Linux runner
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
      - name: Generate PS3-compatible H264 MP3 MPEG-TS fixture
        shell: bash
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'testsrc2=size=640x360:rate=30' -f lavfi -i 'sine=frequency=440:sample_rate=48000' -t 9 -c:v libx264 -preset ultrafast -profile:v baseline -level 3.1 -b:v 1800k -pix_fmt yuv420p -c:a libmp3lame -b:a 192k -ac 2 -f mpegts tools/ps3-lab-windows/tests/fixture.ts
          test -s tools/ps3-lab-windows/tests/fixture.ts
      - name: Upload synthetic TS fixture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ps3-fixture-h264-ts
          path: tools/ps3-lab-windows/tests/fixture.ts
          retention-days: 3

  windows-build:
    name: Windows x64 EXE, parity tests and packaging
    needs: linux-parity
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Windows syntax compile
        run: python -m compileall -q tools/ps3-lab-windows
      - name: Install Pillow for cinematic posters
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Windows parity tests
        working-directory: tools/ps3-lab-windows
        run: python -m unittest discover -s tests -v
      - name: Launch cinematic Windows GUI against fixture Jellyfin
        run: python tools/ps3-lab-windows/tests/ui_smoke.py
      - name: Upload cinematic GUI screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jellyfin-ps3-stream-gui-screenshot
          path: tools/ps3-lab-windows/ci-theater-screenshot.png
          if-no-files-found: ignore
      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0
      - name: Build GUI executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --paths tools/ps3-lab-windows --name Jellyfin-PS3-Stream tools/ps3-lab-windows/app.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed' }
          if (-not (Test-Path dist/Jellyfin-PS3-Stream.exe)) { throw 'GUI executable missing' }
      - name: Download portable mpv
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = 'mpv-x86_64-20261111-git-bcde6b93cc.7z'
          $download = Join-Path $env:RUNNER_TEMP 'mpv-download'
          $extract = Join-Path $env:RUNNER_TEMP 'mpv-extracted'
          New-Item -ItemType Directory -Force $download, $extract, 'dist/mpv' | Out-Null
          gh release download 20261111 --repo shinchiro/mpv-winbuild-cmake --pattern $archive --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'mpv download failed' }
          $file = Join-Path $download $archive
          if (-not (Test-Path $file)) { throw 'mpv archive missing' }
          7z x $file "-o$extract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'mpv extraction failed' }
          $exe = Get-ChildItem -Path $extract -Filter mpv.exe -File -Recurse | Select-Object -First 1
          if ($null -eq $exe) { throw 'mpv.exe missing from archive' }
          Copy-Item -Path (Join-Path $exe.Directory.FullName '*') -Destination dist/mpv -Recurse -Force
          if (-not (Test-Path dist/mpv/mpv.exe)) { throw 'packaged mpv.exe missing' }
      - name: Download synthetic TS fixture from Linux runner
        uses: actions/download-artifact@v4
        with:
          name: ps3-fixture-h264-ts
          path: tools/ps3-lab-windows/tests
      - name: Verify actual mpv video decode inside Windows theater
        shell: pwsh
        run: |
          python tools/ps3-lab-windows/tests/player_smoke.py tools/ps3-lab-windows/tests/fixture.ts dist/mpv/mpv.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows mpv video smoke failed' }
      - name: Package portable zip and checksum
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'Jellyfin-PS3-Stream-Windows-x64.zip'
          Compress-Archive -Path 'dist/Jellyfin-PS3-Stream.exe','dist/mpv' -DestinationPath $zip -CompressionLevel Optimal -Force
          if ((Get-Item $zip).Length -lt 1000000) { throw 'Windows zip unexpectedly small' }
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash
          "$hash  Jellyfin-PS3-Stream-Windows-x64.zip" | Out-File -Encoding ascii (Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Jellyfin-PS3-Stream-Windows-x64
          path: |
            ${{ runner.temp }}/Jellyfin-PS3-Stream-Windows-x64.zip
            ${{ runner.temp }}/SHA256SUMS.txt
          retention-days: 14
      - name: Publish tested Windows prerelease on feature branch
        if: github.event_name == 'push' && (github.ref == 'refs/heads/feature/ps3-parity-diagnostics-20261124' || github.ref == 'refs/heads/feature/windows-jellyfin-theater-20261124')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "ps3-stream-win-$env:GITHUB_RUN_ID"
          $zip = Join-Path $env:RUNNER_TEMP 'Jellyfin-PS3-Stream-Windows-x64.zip'
          $sha = Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt'
          $notes = "GitHub-hosted Windows x64 cinematic Jellyfin client, with embedded mpv video, poster rails, title backdrops, episode navigation, PS3-compatible stream requests and independent diagnostic simulation. Actual PS3 instruction execution requires RPCS3."
          gh release create $tag $zip $sha --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Jellyfin PS3 Lab Windows x64 ($tag)" --notes $notes --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publishing failed' }
